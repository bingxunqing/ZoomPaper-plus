name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.2.3；必须已有对应 v* 标签）"
        required: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "${VERSION}" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号格式无效：${VERSION}"
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          if [ "${PACKAGE_VERSION}" != "${VERSION}" ] || [ "${TAURI_VERSION}" != "${VERSION}" ] || [ "${CARGO_VERSION}" != "${VERSION}" ]; then
            echo "::error::版本不一致：发布=${VERSION}, package=${PACKAGE_VERSION}, tauri=${TAURI_VERSION}, cargo=${CARGO_VERSION}"
            exit 1
          fi
          test -f "docs/RELEASE-v${VERSION}.md" || { echo "::error::缺少发布说明"; exit 1; }
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

  build-macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - name: Build macOS DMG
        run: npm run tauri build -- --bundles dmg --target aarch64-apple-darwin
      - name: Normalize macOS package name
        shell: bash
        run: |
          ARTIFACT="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          mv "${ARTIFACT}" "$(dirname "${ARTIFACT}")/ZoomPaper.Plus_${{ needs.validate.outputs.version }}_aarch64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis
      - name: Normalize Windows package name
        shell: pwsh
        run: |
          $artifact = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Move-Item $artifact.FullName (Join-Path $artifact.DirectoryName "ZoomPaper.Plus_${{ needs.validate.outputs.version }}_x64-setup.exe")
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  build-linux:
    needs: validate
    # ONNX Runtime 1.28 binaries require glibc 2.38+ and a recent libstdc++.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - name: Build Linux packages
        run: npm run tauri build -- --bundles deb,appimage
      - name: Normalize Linux package names
        shell: bash
        run: |
          DEB="$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          mv "${DEB}" "$(dirname "${DEB}")/ZoomPaper.Plus_${{ needs.validate.outputs.version }}_amd64.deb"
          mv "${APPIMAGE}" "$(dirname "${APPIMAGE}")/ZoomPaper.Plus_${{ needs.validate.outputs.version }}_amd64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  package-extension:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Chrome and Edge extension
        working-directory: browser-extension
        run: zip -r "../ZoomPaper-Plus-Connector_${{ needs.validate.outputs.version }}.zip" . -x "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: release-browser-extension
          path: ZoomPaper-Plus-Connector_${{ needs.validate.outputs.version }}.zip
          if-no-files-found: error

  release:
    needs: [validate, build-macos, build-windows, build-linux, package-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Check release assets
        run: find release-assets -maxdepth 3 -type f -print
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mapfile -d '' ASSETS < <(find release-assets -type f -print0)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::没有找到可发布的安装包"
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
            gh release edit "${TAG}" \
              --draft \
              --title "ZoomPaper Plus v${VERSION}" \
              --notes-file "docs/RELEASE-v${VERSION}.md"
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --draft \
              --verify-tag \
              --title "ZoomPaper Plus v${VERSION}" \
              --notes-file "docs/RELEASE-v${VERSION}.md"
          fi
